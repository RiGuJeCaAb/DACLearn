ComponentDefinitions:
  AppHeader:
    DefinitionType: CanvasComponent
    AllowCustomization: true
    CustomProperties:
      HeaderTitle:
        PropertyKind: Input
        DisplayName: HeaderTitle
        Description: Title text shown in the header
        DataType: Text
        Default: ="Contoso Coffee"
    Properties:
      Height: =80
      Width: =1366
    Children:
      - Rectangle1:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Height: =Parent.Height
            Width: =Parent.Width
      - Label1:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            Height: =Parent.Height
            Size: =24
            Text: =AppHeader.HeaderTitle
            Width: =Parent.Width
