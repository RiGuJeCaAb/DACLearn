                              RadiusBottomLeft: =8
                              RadiusBottomRight: =8
                              RadiusTopLeft: =8
                              RadiusTopRight: =8
                              Width: =72
                              X: =16
                              Y: =(Parent.TemplateHeight / 2) - (Self.Height / 2)
