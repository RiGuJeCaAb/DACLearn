Screens:
  Home Screen:
    Properties:
      LoadingSpinnerColor: =RGBA(56, 96, 178, 1)
    Children:
      - Button2:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =100
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate('Catalog Screen', ScreenTransition.Cover)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="View Catalog"
            Width: =250
            X: =(Parent.Width - Self.Width) / 2
            Y: =250
      - Button3:
          Control: Classic/Button@2.2.0
          Properties:
            BorderColor: =ColorFade(Self.Fill, -15%)
            Color: =RGBA(255, 255, 255, 1)
            DisabledBorderColor: =RGBA(166, 166, 166, 1)
            Fill: =RGBA(56, 96, 178, 1)
            Font: =Font.'Open Sans'
            Height: =100
            HoverBorderColor: =ColorFade(Self.BorderColor, 20%)
            HoverColor: =RGBA(255, 255, 255, 1)
            HoverFill: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            OnSelect: =Navigate('Admin Screen', ScreenTransition.Fade)
            PressedBorderColor: =Self.Fill
            PressedColor: =Self.Fill
            PressedFill: =Self.Color
            Text: ="Admin Screen"
            Width: =250
            X: =Button2.X
            Y: =Button2.Y + Button2.Height + 50
      - Rectangle3:
          Control: Rectangle@2.3.0
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Fill: =Rectangle2.Fill
            Height: =Rectangle2.Height
            Width: =Parent.Width
      - Label2:
          Control: Label@2.5.1
          Properties:
            Align: =Align.Center
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Label1.Color
            Font: =Font.'Open Sans'
            Height: =Rectangle2.Height
            Size: =Label1.Size
            Text: ='Home Screen'.Name
            Width: =Parent.Width
      - Dropdown1:
          Control: Classic/DropDown@2.3.1
          Properties:
            AccessibleLabel: ="Navegação entre ecrãs"
            BorderColor: =RGBA(0, 18, 107, 1)
            ChevronBackground: =RGBA(56, 96, 178, 1)
            ChevronFill: =RGBA(255, 255, 255, 1)
            ChevronHoverBackground: =ColorFade(RGBA(56, 96, 178, 1), -20%)
            ChevronHoverFill: =RGBA(255, 255, 255, 1)
            Default: =""
            Font: =Font.'Open Sans'
            Height: =36
            HoverFill: =RGBA(186, 202, 226, 1)
            Items: =["", "Catalog Screen", "Admin Screen"]
            Items.Value: =Value
            OnChange: =Switch(Self.Selected.Value, "Catalog Screen", Navigate('Catalog Screen', ScreenTransition.Cover), "Admin Screen", Navigate('Admin Screen', ScreenTransition.Cover)); Reset(Self)
            PressedColor: =RGBA(255, 255, 255, 1)
            PressedFill: =RGBA(0, 18, 107, 1)
            SelectionColor: =RGBA(255, 255, 255, 1)
            SelectionFill: =RGBA(56, 96, 178, 1)
            X: =20
            Y: =32
      - Label5:
          Control: Label@2.5.1
          Properties:
            BorderColor: =RGBA(0, 18, 107, 1)
            Color: =Color.White
            Font: =Font.'Open Sans'
            Height: =26
            Size: =11
            Text: ="Screen Navigation"
            X: =20
            Y: =4
