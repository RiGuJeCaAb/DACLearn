App:
  Properties:
    Formulas: |-
      =EspressoColor = RGBA(
          101,
          67,
          33,
          1
      );
      CommercialColor = RGBA(
          0,
          80,
          128,
          1
      );
      StandardColor = RGBA(
          100,
          100,
          100,
          1
      );
      TypeColor(machineType: Text): Color = If(
          "Espresso" in machineType,
          EspressoColor,
          "Commercial" in machineType,
          CommercialColor,
          StandardColor
      );
      MachineSummary(name: Text, machineType: Text): Text = name & " (" & machineType & ")";
    Theme: =PowerAppsTheme
