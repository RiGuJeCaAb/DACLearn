                  PaddingBottom: =16
                  PaddingLeft: =16
                  PaddingRight: =16
                  PaddingTop: =16
                  Tooltip: ="Ver detalhes do item"
                  Width: =50
                  X: =Parent.TemplateWidth - Self.Width - 12
