# Verificação automática: corre em cada push e pull request. Não precisa de credenciais.
name: Verificar

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar dependências
        run: pip install -e ".[dev]"

      - name: Validar YAML, schema oficial e sintaxe das fórmulas
        run: python -m tools.learn validar

      - name: Documentos gerados atualizados
        run: |
          python -m tools.learn inventario --verificar
          python -m tools.learn dataverse --verificar

      - name: Testes das ferramentas
        run: python -m pytest
